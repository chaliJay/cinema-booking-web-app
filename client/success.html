
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - CineBook</title>
    <link rel="stylesheet" href="test.css">
</head>

<body>

    <section style="text-align:center; padding:80px 20px;">

        <h1 style="color:green;">✓ Payment Successful!</h1>

        <h2>Thank you for booking with CineBook!</h2>

        <p id="paymentStatus">Verifying your payment...</p>

        <div id="bookingDetails"></div>

        <br>

        <a href="movies.html">
            <button>Book More Movies</button>
        </a>

        <br><br>

        <a href="home.html">Return to Home</a>

    </section>

    <script>
        async function verifyPayment() {
            const params = new URLSearchParams(window.location.search);
            const sessionId = params.get("session_id");

            const status = document.getElementById("paymentStatus");
            const details = document.getElementById("bookingDetails");

            if (!sessionId) {
                status.textContent = "No payment session was provided.";
                return;
            }

            try {
                const response = await fetch(
                    `http://localhost:5000/api/verify-session?session_id=${encodeURIComponent(sessionId)}`
                );

                const data = await response.json();

                if (!response.ok || !data.paid) {
                    status.textContent =
                        "Payment could not be verified. Please contact support.";
                    return;
                }

                status.textContent = "Your payment has been verified successfully!";

                details.innerHTML = `
                    <h3>Booking Details</h3>
                    <p>Movie: ${data.movie}</p>
                    <p>Amount paid: €${(data.amount / 100).toFixed(2)}</p>
                    <p>Payment status: Paid</p>
                `;

            } catch (error) {
                console.error(error);
                status.textContent =
                    "Unable to verify payment. Please try again.";
            }
        }

        verifyPayment();
    </script>

</body>
</html>
